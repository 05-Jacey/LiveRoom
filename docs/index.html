<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LiveRoom · 聊天室</title>
<style>
  :root { --bg:#f5f6fa; --card:#fff; --main:#4f6ef7; --txt:#222; --sub:#888; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif; background:var(--bg); color:var(--txt); height:100vh; display:flex; flex-direction:column; }
  header { background:var(--main); color:#fff; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:18px; }
  header .st { font-size:12px; opacity:.9; }
  main { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:78%; padding:8px 12px; border-radius:12px; background:var(--card); box-shadow:0 1px 2px rgba(0,0,0,.06); word-break:break-word; }
  .msg.me { align-self:flex-end; background:var(--main); color:#fff; }
  .msg .who { font-size:12px; color:var(--sub); margin-bottom:2px; }
  .msg.me .who { color:rgba(255,255,255,.8); }
  .sys { align-self:center; font-size:12px; color:var(--sub); }
  footer { display:flex; gap:8px; padding:10px 12px; background:var(--card); border-top:1px solid #e5e6eb; }
  input,button { font-size:15px; padding:10px 12px; border-radius:8px; border:1px solid #d8dae0; outline:none; }
  button { border:none; background:var(--main); color:#fff; cursor:pointer; }
  button:disabled { background:#b9c0d8; cursor:not-allowed; }
  button.gray { background:#8a8f9c; }
  #roomBar { display:flex; gap:8px; padding:10px 12px; background:#eef0f6; border-bottom:1px solid #e5e6eb; }
  #roomBar input { flex:1; }
  #nick { width:90px; }
  #msgInput { flex:1; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<header>
  <h1>LiveRoom 聊天室 <span id="roomTag" class="hidden">· <span id="roomName"></span></span></h1>
  <span class="st" id="status">未连接</span>
</header>

<div id="roomBar">
  <input id="nick" placeholder="昵称" maxlength="12">
  <input id="roomInput" placeholder="房间名，如 room1" value="room1">
  <button id="joinBtn">加入房间</button>
</div>

<main id="chat"></main>

<footer>
  <input id="msgInput" placeholder="输入消息…" class="hidden">
  <button id="sendBtn" class="hidden">发送</button>
  <button id="leaveBtn" class="hidden gray">离开房间</button>
</footer>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
const BROKER = 'wss://broker.emqx.io:8084/mqtt';
const BASE = 'liveroom/web/';
const MAX_LOCAL = 200;

let client = null, room = null, nick = null;
let history = [];            // [{who, text, ts, mine}]
let myHistTopic = null;      // 供他人回传历史的私聊主题

const $ = id => document.getElementById(id);
const chatEl = $('chat'), statusEl = $('status');

function ts2str(ts) {
  const d = new Date(ts);
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}
function loadLocal() {
  try { history = JSON.parse(localStorage.getItem('liveroom_hist_' + room)) || []; }
  catch { history = []; }
}
function saveLocal() {
  if (history.length > MAX_LOCAL) history = history.slice(-MAX_LOCAL);
  localStorage.setItem('liveroom_hist_' + room, JSON.stringify(history));
}
function renderMsg(m) {
  const div = document.createElement('div');
  if (m.sys) { div.className = 'sys'; div.textContent = m.text; }
  else {
    div.className = 'msg' + (m.mine ? ' me' : '');
    div.innerHTML = '<div class="who"></div><div class="tx"></div>';
    div.querySelector('.who').textContent = m.who + ' ' + ts2str(m.ts);
    div.querySelector('.tx').textContent = m.text;
  }
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}
function renderAll() {
  chatEl.innerHTML = '';
  history.forEach(renderMsg);
}
function addMsg(m, persist = true) {
  history.push(m);
  if (persist) saveLocal();
  renderMsg(m);
}

function connect() {
  statusEl.textContent = '连接中…';
  client = mqtt.connect(BROKER, { clientId: 'lr_' + Math.random().toString(16).slice(2, 10), clean: true });
  client.on('connect', () => { statusEl.textContent = '已连接 broker'; });
  client.on('reconnect', () => { statusEl.textContent = '重连中…'; });
  client.on('close', () => { statusEl.textContent = '连接断开'; });
  client.on('error', e => { statusEl.textContent = '错误: ' + e.message; });
  client.on('message', onMessage);
}

function onMessage(topic, payload) {
  let data;
  try { data = JSON.parse(payload.toString()); } catch { return; }
  if (topic === myHistTopic && data.type === 'history') {
    const seen = new Set(history.filter(m => !m.sys).map(m => m.who + '|' + m.ts + '|' + m.text));
    let added = 0;
    for (const m of data.messages || []) {
      const key = m.who + '|' + m.ts + '|' + m.text;
      if (!seen.has(key)) { history.push({ who: m.who, text: m.text, ts: m.ts, mine: false }); seen.add(key); added++; }
    }
    history.sort((a, b) => a.ts - b.ts);
    saveLocal(); renderAll();
    if (added) addMsg({ sys: true, text: '已从在线成员同步 ' + added + ' 条历史消息' });
    return;
  }
  if (room && topic === BASE + room && data.type === 'chat') {
    addMsg({ who: data.who, text: data.text, ts: data.ts || Date.now(), mine: false });
  } else if (room && topic === BASE + room && data.type === 'history-req' && data.from !== myHistTopic) {
    // 有新人求历史：把自己的记录快照私发给他
    client.publish(myHistTopic === null ? topic : data.from, JSON.stringify({
      type: 'history', messages: history.filter(m => !m.sys).slice(-MAX_LOCAL)
    }));
  }
}

$('joinBtn').onclick = () => {
  nick = $('nick').value.trim();
  room = $('roomInput').value.trim().replace(/\s+/g, '-').toLowerCase();
  if (!nick) { nick = '访客' + Math.floor(Math.random() * 100); $('nick').value = nick; }
  if (!room) room = 'room1';
  if (!client) connect();
  const doJoin = () => {
    myHistTopic = BASE + 'dm/' + client.options.clientId;
    client.subscribe([BASE + room, myHistTopic], { qos: 0 }, () => {
      loadLocal(); renderAll();
      addMsg({ sys: true, text: '已加入房间「' + room + '」（历史来自本地缓存 + 在线成员同步）' });
      // 广播求历史
      client.publish(BASE + room, JSON.stringify({ type: 'history-req', from: myHistTopic }));
      $('roomTag').classList.remove('hidden');
      $('roomName').textContent = room;
      for (const id of ['msgInput', 'sendBtn', 'leaveBtn']) $(id).classList.remove('hidden');
      $('joinBtn').textContent = '换房';
      statusEl.textContent = '已连接 · 在线';
    });
  };
  if (client.connected) doJoin(); else client.once('connect', doJoin);
};

function send() {
  const input = $('msgInput');
  const text = input.value.trim();
  if (!text || !client || !client.connected || !room) return;
  const m = { who: nick, text, ts: Date.now() };
  client.publish(BASE + room, JSON.stringify({ type: 'chat', ...m }));
  addMsg({ ...m, mine: true });
  input.value = '';
}
$('sendBtn').onclick = send;
$('msgInput').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

$('leaveBtn').onclick = () => {
  if (client && room) client.unsubscribe(BASE + room);
  addMsg({ sys: true, text: '已离开房间（本地记录已保存）' });
  room = null;
  $('roomTag').classList.add('hidden');
  for (const id of ['msgInput', 'sendBtn', 'leaveBtn']) $(id).classList.add('hidden');
  statusEl.textContent = '已连接 broker · 未在房间';
};

$('nick').value = localStorage.getItem('liveroom_nick') || '';
$('nick').addEventListener('change', () => localStorage.setItem('liveroom_nick', $('nick').value.trim()));
</script>
</body>
</html>
