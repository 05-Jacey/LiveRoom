<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>LiveRoom</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body { font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif; background:#F5F6F8; color:#1F2329; display:flex; flex-direction:column; }
  button { border:none; cursor:pointer; font-family:inherit; }
  input { font-family:inherit; outline:none; }
  .hidden { display:none !important; }

  /* ---- 首页 ---- */
  #home { flex:1; overflow-y:auto; padding:20px 16px 24px; }
  #home h1 { font-size:30px; }
  #home .sub { font-size:14px; color:#8A8F99; margin:6px 0 20px; }
  .card { background:#fff; border-radius:14px; padding:16px; margin-bottom:14px; }
  .card .ct { font-size:16px; font-weight:bold; margin-bottom:12px; }
  .lbl { font-size:13px; color:#8A8F99; margin-bottom:4px; }
  .card input { height:44px; width:100%; border:1px solid #E0E3E8; border-radius:8px; padding:0 12px; font-size:15px; margin-bottom:10px; }
  .hint { font-size:12px; color:#9A9FA8; }
  .room { background:#fff; border-radius:12px; padding:14px; margin-top:10px; cursor:pointer; }
  .room .rt { display:flex; justify-content:space-between; align-items:center; }
  .room .rn { font-size:16px; font-weight:500; }
  .badge { font-size:12px; padding:2px 9px; border-radius:10px; }
  .badge.chat { color:#3367C4; background:#E8F0FE; }
  .badge.board { color:#B2603A; background:#FCEEE6; }
  .room .rd { font-size:13px; color:#8A8F99; margin-top:4px; }
  .foot { text-align:center; font-size:12px; color:#9A9FA8; margin-top:16px; }

  /* ---- 房间页通用 ---- */
  #room { flex:1; display:flex; flex-direction:column; }
  .rheader { background:#fff; border-bottom:1px solid #E8EAEE; padding:10px 14px; display:flex; align-items:center; gap:10px; }
  .rheader .back { background:none; font-size:18px; color:#8A8F99; padding:4px 8px; }
  .rheader .rt1 { flex:1; min-width:0; }
  .rheader .rn { font-size:17px; font-weight:bold; }
  .rheader .st { font-size:12px; color:#2E9E7B; }
  .rheader .st.off { color:#D9534F; }
  .rheader .mem { font-size:12px; color:#8A8F99; }
  .btn-close { background:#FDECEC; color:#D9534F; font-size:13px; padding:6px 12px; border-radius:8px; }

  /* ---- 聊天 ---- */
  #chat { flex:1; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:10px; }
  .bubble { max-width:78%; padding:8px 12px; border-radius:12px; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.05); word-break:break-word; }
  .bubble.me { align-self:flex-end; background:#4F7DF3; color:#fff; }
  .bubble .who { font-size:12px; color:#8A8F99; margin-bottom:2px; }
  .bubble.me .who { color:rgba(255,255,255,.85); }
  .sysmsg { align-self:center; font-size:12px; color:#9A9FA8; }
  .chatbar { display:flex; gap:8px; padding:10px 12px; background:#fff; border-top:1px solid #E8EAEE; }
  .chatbar input { flex:1; height:42px; border:1px solid #E0E3E8; border-radius:8px; padding:0 12px; font-size:15px; }
  .chatbar button { background:#4F7DF3; color:#fff; font-size:15px; padding:0 20px; border-radius:8px; }

  /* ---- 白板 ---- */
  .toolbar { display:flex; align-items:center; gap:8px; padding:8px 12px; background:#fff; border-top:1px solid #E8EAEE; flex-wrap:wrap; }
  .swatch { width:28px; height:28px; border-radius:50%; border:3px solid transparent; cursor:pointer; }
  .swatch.on { border-color:#4F7DF3; }
  .wsel { width:34px; height:34px; border-radius:8px; border:none; background:#EEF0F4; color:#1F2329; font-size:13px; }
  .wsel.on { background:#4F7DF3; color:#fff; }
  #boardWrap { flex:1; position:relative; background:#fff; touch-action:none; }
  #board { position:absolute; inset:0; width:100%; height:100%; cursor:crosshair; }
</style>
</head>
<body>

<!-- ============ 首页 ============ -->
<div id="home">
  <h1>LiveRoom</h1>
  <div class="sub">多房间实时聊天 · 多人协作白板</div>

  <div class="card">
    <div class="ct">连接设置</div>
    <div class="lbl">昵称</div>
    <input id="nick" placeholder="你的昵称" maxlength="12">
    <div class="hint">网页版无需填服务器地址，消息通过公共 MQTT 服务（broker.emqx.io）转发，电脑关机也能用。</div>
  </div>

  <div class="card" style="margin-bottom:0;">
    <div class="ct">选择房间</div>
    <div class="room" data-room="chat-lobby" data-name="大厅闲聊" data-type="chat">
      <div class="rt"><span class="rn">大厅闲聊</span><span class="badge chat">聊天</span></div>
      <div class="rd">随便聊聊，所有人都能进</div>
    </div>
    <div class="room" data-room="chat-dev" data-name="技术茶馆" data-type="chat">
      <div class="rt"><span class="rn">技术茶馆</span><span class="badge chat">聊天</span></div>
      <div class="rd">HarmonyOS / 网络 / 踩坑记录</div>
    </div>
    <div class="room" data-room="board-canvas" data-name="一起画" data-type="board">
      <div class="rt"><span class="rn">一起画</span><span class="badge board">白板</span></div>
      <div class="rd">多人实时协作白板</div>
    </div>
    <div class="room" data-room="board-brain" data-name="头脑风暴" data-type="board">
      <div class="rt"><span class="rn">头脑风暴</span><span class="badge board">白板</span></div>
      <div class="rd">画点什么，边聊边改</div>
    </div>
  </div>
  <div class="foot">同一房间的手机浏览器、电脑浏览器消息互通（与鸿蒙 App 的本地服务器相互独立）</div>
</div>

<!-- ============ 房间页 ============ -->
<div id="room" class="hidden">
  <div class="rheader">
    <button class="back" onclick="leaveRoom()">‹</button>
    <div class="rt1">
      <div class="rn" id="roomTitle"></div>
      <div class="st" id="status">连接中…</div>
    </div>
    <div class="mem" id="mem"></div>
    <button class="btn-close" onclick="closeServer()">关闭服务器</button>
  </div>

  <!-- 聊天 -->
  <div id="chat"></div>
  <div class="chatbar" id="chatbar">
    <input id="msgInput" placeholder="输入消息…">
    <button onclick="sendChat()">发送</button>
  </div>

  <!-- 白板 -->
  <div id="boardWrap" class="hidden">
    <canvas id="board"></canvas>
    <div class="toolbar">
      <div class="swatch" style="background:#1F2329" data-c="#1F2329"></div>
      <div class="swatch" style="background:#4F7DF3" data-c="#4F7DF3"></div>
      <div class="swatch" style="background:#E8794B" data-c="#E8794B"></div>
      <div class="swatch" style="background:#2E9E7B" data-c="#2E9E7B"></div>
      <div class="swatch" style="background:#9B6BDB" data-c="#9B6BDB"></div>
      <div class="swatch" style="background:#D9538A" data-c="#D9538A"></div>
      <span style="flex:1"></span>
      <button class="wsel" data-w="2">细</button>
      <button class="wsel on" data-w="4">中</button>
      <button class="wsel" data-w="8">粗</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
const BROKER = 'wss://broker.emqx.io:8084/mqtt';
const BASE = 'liveroom/web/';
const MAX_HIST = 200, MAX_STROKES = 600;
const COLORS = ['#1F2329','#4F7DF3','#E8794B','#2E9E7B','#9B6BDB','#D9538A'];

const $ = id => document.getElementById(id);
let client=null, room=null, roomName='', roomType='chat', nick='';
let myDmTopic = null;       // 私聊主题，收历史回传
let serverOn = false;       // 「关闭服务器」开关状态

/* ---------- 状态/消息存储 ---------- */
let chatHist = [];          // 聊天房间
let strokes = [];           // 白板房间 [{c,w,pts:[[nx,ny]...]}]

function histKey(){ return 'lr_h_' + room; }
function strokeKey(){ return 'lr_s_' + room; }
function loadLocal(){
  try { chatHist = JSON.parse(localStorage.getItem(histKey())) || []; } catch { chatHist=[]; }
  try { strokes = JSON.parse(localStorage.getItem(strokeKey())) || []; } catch { strokes=[]; }
}
function saveLocal(){
  if (roomType==='chat'){
    if (chatHist.length>MAX_HIST) chatHist = chatHist.slice(-MAX_HIST);
    localStorage.setItem(histKey(), JSON.stringify(chatHist));
  } else {
    if (strokes.length>MAX_STROKES) strokes = strokes.slice(-MAX_STROKES);
    localStorage.setItem(strokeKey(), JSON.stringify(strokes));
  }
}

/* ---------- MQTT ---------- */
function ensureClient(){
  if (client) return;
  setStatus('连接中…', true);
  client = mqtt.connect(BROKER, { clientId:'lr_'+Math.random().toString(16).slice(2,10), clean:true });
  client.on('connect', ()=>{ if(serverOn) setStatus('已连接', false); });
  client.on('close',   ()=>{ if(serverOn) setStatus('重连中…', true); });
  client.on('error',   e => setStatus('错误', true));
  client.on('message', onMessage);
}

function setStatus(t, off){ const el=$('status'); el.textContent=t; el.className='st'+(off?' off':''); }

function onMessage(topic, payload){
  let d; try { d = JSON.parse(payload.toString()); } catch { return; }
  if (topic === myDmTopic && d.type==='history'){
    // 在线成员回传的历史快照，合并去重
    if (roomType==='chat'){
      const seen = new Set(chatHist.filter(m=>!m.sys).map(m=>m.k));
      let n=0;
      for (const m of d.messages||[]) if (m.k && !seen.has(m.k)) { chatHist.push(m); seen.add(m.k); n++; }
      chatHist.sort((a,b)=>(a.ts||0)-(b.ts||0));
      saveLocal(); renderChat();
      if (n) sys('已同步 '+n+' 条历史消息');
    } else {
      const seen = new Set(strokes.map(s=>s.k));
      let n=0;
      for (const s of d.messages||[]) if (s.k && !seen.has(s.k)) { strokes.push(s); seen.add(s.k); n++; }
      saveLocal(); redraw();
      if (n) sys('已同步 '+n+' 条笔迹');
    }
    return;
  }
  if (!room || !serverOn) return;
  const t = BASE + (roomType==='chat'?'chat/':'board/') + room;
  if (topic !== t) return;

  if (roomType==='chat'){
    if (d.type==='chat' && d.k && !d.mine) addChat(d, false);
    else if (d.type==='history-req' && d.from !== myDmTopic)
      client.publish(d.from, JSON.stringify({ type:'history', messages: chatHist.filter(m=>!m.sys) }));
  } else {
    if (d.type==='stroke' && d.k && d.k !== myDmTopic.slice(-8)){
      strokes.push(d); saveLocal(); drawStroke(d);
    } else if (d.type==='clear'){
      strokes = []; saveLocal(); redraw(); sys('白板已被清空');
    } else if (d.type==='history-req' && d.from !== myDmTopic)
      client.publish(d.from, JSON.stringify({ type:'history', messages: strokes }));
  }
}

/* ---------- 进入 / 离开房间 ---------- */
document.querySelectorAll('.room').forEach(el => el.onclick = () => {
  nick = $('nick').value.trim() || ('访客'+Math.floor(Math.random()*100));
  $('nick').value = nick;
  localStorage.setItem('lr_nick', nick);
  enterRoom(el.dataset.room, el.dataset.name, el.dataset.type);
});

function enterRoom(id, name, type){
  room=id; roomName=name; roomType=type; serverOn=true;
  ensureClient();
  $('home').classList.add('hidden');
  $('room').classList.remove('hidden');
  $('roomTitle').textContent = name;
  $('mem').textContent = '';
  const isChat = type==='chat';
  $('chat').classList.toggle('hidden', !isChat);
  $('chatbar').classList.toggle('hidden', !isChat);
  $('boardWrap').classList.toggle('hidden', isChat);
  loadLocal();
  if (isChat) renderChat(); else { sizeBoard(); redraw(); }

  const doJoin = () => {
    myDmTopic = BASE + 'dm/' + client.options.clientId;
    client.subscribe([t_full(), myDmTopic], ()=> {
      setStatus('已连接', false);
      sys('已加入「'+name+'」'+(isChat?'':' · '+strokes.length+' 条笔迹'));
      client.publish(t_full(), JSON.stringify({ type:'history-req', from: myDmTopic }));
    });
  };
  if (client.connected) doJoin(); else client.once('connect', doJoin);
}

function t_full(){ return BASE + (roomType==='chat'?'chat/':'board/') + room; }

function leaveRoom(){
  if (client && room) client.unsubscribe(t_full());
  room=null; serverOn=false;
  $('room').classList.add('hidden');
  $('home').classList.remove('hidden');
}

/* 「关闭服务器」：断开 MQTT 连接，页面保留，可再点重连 */
function closeServer(){
  if (!serverOn) { // 已关闭状态 → 重连
    serverOn = true;
    client.reconnect();
    client.once('connect', ()=>{
      client.subscribe([t_full(), myDmTopic], ()=>{ setStatus('已连接', false); sys('已重新连接'); });
    });
    setStatus('连接中…', true);
    return;
  }
  serverOn = false;
  if (client) client.end(true);
  client = null;
  setStatus('已断开', true);
  sys('连接已关闭（页面保留，点此处按钮可重新连接）');
}

/* ---------- 聊天 ---------- */
function ts2(t){ const d=new Date(t); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function renderChat(){ $('chat').innerHTML=''; chatHist.forEach(b=>addChat(b,true,true)); }
function addChat(m, mine, noSave){
  chatHist.push(m);
  if (!noSave) saveLocal();
  const div=document.createElement('div');
  div.className = m.sys ? 'sysmsg' : 'bubble'+(m.mine?' me':'');
  if (m.sys) div.textContent = m.text;
  else { div.innerHTML='<div class="who"></div><div></div>';
         div.firstChild.textContent = (m.who||'匿名')+' '+ts2(m.ts||Date.now());
         div.lastChild.textContent = m.text; }
  $('chat').appendChild(div);
  $('chat').scrollTop = $('chat').scrollHeight;
}
function sys(t){ addChat({sys:true, text:t}, false); }
$('msgInput').addEventListener('keydown', e=>{ if(e.key==='Enter') sendChat(); });
function sendChat(){
  const v = $('msgInput').value.trim();
  if (!v || !client || !client.connected || !serverOn || roomType!=='chat') return;
  const m = { type:'chat', who:nick, text:v, ts:Date.now(), k:nick+'|'+Date.now()+Math.random(), mine:true };
  client.publish(t_full(), JSON.stringify(m));
  const {type:_t, ...rest} = m;
  addChat(rest, true);
  $('msgInput').value='';
}

/* ---------- 白板 ---------- */
const canvas=$('board'), ctx=canvas.getContext('2d');
let curColor='#1F2329', curW=4, drawing=false, curPts=[], lastT=0;

document.querySelectorAll('.swatch').forEach(el=>el.onclick=()=>{
  curColor=el.dataset.c;
  document.querySelectorAll('.swatch').forEach(x=>x.classList.toggle('on', x===el));
});
document.querySelectorAll('.wsel').forEach(el=>el.onclick=()=>{
  curW=+el.dataset.w;
  document.querySelectorAll('.wsel').forEach(x=>x.classList.toggle('on', x===el));
});
document.querySelector('.swatch').classList.add('on');

function sizeBoard(){
  const w=canvas.clientWidth, h=canvas.clientHeight;
  if (canvas.width!==w || canvas.height!==h){ canvas.width=w; canvas.height=h; }
}
window.addEventListener('resize', ()=>{ if(roomType==='board' && room) redraw(); });

function drawStroke(s){
  ctx.strokeStyle=s.c; ctx.lineWidth=(s.w||4)*Math.min(canvas.width,canvas.height)/600;
  ctx.lineWidth=Math.max(1.5, ctx.lineWidth);
  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath();
  s.pts.forEach((p,i)=>{ const x=p[0]*canvas.width, y=p[1]*canvas.height;
    i? ctx.lineTo(x,y) : ctx.moveTo(x,y); });
  if (s.pts.length===1){ const p=s.pts[0]; ctx.arc(p[0]*canvas.width,p[1]*canvas.height,ctx.lineWidth/2,0,7); ctx.fillStyle=s.c; ctx.fill(); }
  ctx.stroke();
}
function redraw(){ sizeBoard(); ctx.clearRect(0,0,canvas.width,canvas.height); strokes.forEach(drawStroke); }

function pos(e){
  const r=canvas.getBoundingClientRect();
  const p=e.touches? e.touches[0] : e;
  return [ (p.clientX-r.left)/r.width, (p.clientY-r.top)/r.height ];
}
canvas.addEventListener('pointerdown', e=>{
  if(!serverOn||!room) return;
  drawing=true; curPts=[pos(e)]; canvas.setPointerCapture(e.pointerId);
  const s=mkStroke(); drawStroke(s);
});
canvas.addEventListener('pointermove', e=>{
  if(!drawing) return;
  const now=Date.now(); if(now-lastT<25) return; lastT=now;
  curPts.push(pos(e)); drawStroke(mkStroke());
});
canvas.addEventListener('pointerup', ()=>{
  if(!drawing) return; drawing=false;
  if(curPts.length<2){ curPts.push(curPts[0]); }
  const s=mkStroke(true);
  strokes.push(s); saveLocal();
  if(client&&client.connected&&serverOn) client.publish(t_full(), JSON.stringify(s));
});
function mkStroke(send){
  const k = nick+'|'+Date.now()+(send?'':Math.random());
  return { type:'stroke', c:curColor, w:curW, pts:[...curPts], k, mine:!!send };
}

/* 清空白板：长按白板页顶部房间名触发 */
let holdTimer=null;
$('roomTitle').addEventListener('pointerdown', ()=>{ holdTimer=setTimeout(()=>{
  strokes=[]; saveLocal(); redraw();
  if(client&&client.connected&&serverOn) client.publish(t_full(), JSON.stringify({type:'clear'}));
  sys('已清空白板');
}, 1200); });
$('roomTitle').addEventListener('pointerup', ()=>clearTimeout(holdTimer));

/* ---------- 启动 ---------- */
$('nick').value = localStorage.getItem('lr_nick') || '';
</script>
</body>
</html>
